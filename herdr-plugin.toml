id = "yersonargotev.tab-git"
name = "Tab Git Tokens"
version = "1.1.0"
min_herdr_version = "0.9.1"
description = "Active tab name and separate Git tokens for each Space"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "run.sh", "--all"]

[[events]]
on = "pane.focused"
command = ["sh", "run.sh"]

[[events]]
on = "workspace.focused"
command = ["sh", "run.sh"]

[[events]]
on = "pane.created"
command = ["sh", "run.sh"]

[[events]]
on = "tab.focused"
command = ["sh", "run.sh"]

[[events]]
on = "tab.created"
command = ["sh", "run.sh", "--all"]

[[events]]
on = "tab.renamed"
command = ["sh", "run.sh", "--all"]

[[events]]
on = "tab.closed"
command = ["sh", "run.sh", "--all"]

[[events]]
on = "tab.moved"
command = ["sh", "run.sh", "--all"]

[[actions]]
id = "refresh"
title = "Refresh tab git status"
contexts = ["workspace"]
command = ["sh", "run.sh", "--all"]

[[actions]]
id = "clear"
title = "Clear tab git tokens"
contexts = ["workspace"]
command = ["sh", "run.sh", "--clear"]
